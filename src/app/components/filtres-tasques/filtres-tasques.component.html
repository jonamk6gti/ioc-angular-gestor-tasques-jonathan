<form class="filtres" (ngSubmit)="onAplicar()">
  <div class="camp">
    <label for="filtre-text">Text de cerca</label>
    <input id="filtre-text" name="text" type="text" [(ngModel)]="text" />
  </div>

  <div class="camp">
    <label for="filtre-categoria">Categoria</label>
    <select id="filtre-categoria" name="categoria" [(ngModel)]="categoria">
      <option value="">Totes les categories</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" class="boto boto--primari">Aplicar filtres</button>
    <button type="button" class="boto" (click)="onRestablir()">Restablir filtres</button>
  </div>
</form>
