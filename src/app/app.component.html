<header class="capcalera">
  <h1>{{ appName }}</h1>
  <p>Autor: Jonathan | Aplicació per gestionar les tasques diàries del curs d'Angular.</p>
</header>

<main class="container">
  <app-filtres-tasques
    [categories]="categories"
    (aplicar)="aplicarFiltres($event)"
    (restablir)="restablirFiltres()"
  />

  <div class="layout">
    <section class="layout__llista" aria-labelledby="llista-titol">
      <h2 id="llista-titol">Llistat de tasques</h2>
      <app-tasca-llista
        [tasques]="tasquesFiltrades"
        [idSeleccionada]="tascaSeleccionada?.id ?? null"
        (seleccionar)="seleccionarTasca($event)"
      />
    </section>

    <aside class="layout__detall">
      <app-tasca-detall [tasca]="tascaSeleccionada" />
    </aside>
  </div>
</main>
<router-outlet />
